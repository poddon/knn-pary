name: Build Windows EXE
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          dotnet publish windows/KNNPary.csproj -c Release -o out 2>&1 | tee build.log
          ls -la out
      - name: Save build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/log" && tail -200 build.log > "$RUNNER_TEMP/log/build.log" && cd "$RUNNER_TEMP/log"
          git init -q -b build-log-win && git add build.log
          git -c user.name=ci -c user.email=ci@localhost commit -qm "windows build log $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" build-log-win
      - name: Publish EXE (release + exe branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/KNN-pary.exe KNN-pary.exe
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "КНН пары" --notes "Свежие сборки «КНН пары»" --prerelease
          gh release upload latest KNN-pary.exe --clobber
          mkdir -p "$RUNNER_TEMP/exe" && cp KNN-pary.exe "$RUNNER_TEMP/exe/" && cd "$RUNNER_TEMP/exe"
          git init -q -b exe && git add KNN-pary.exe
          git -c user.name=ci -c user.email=ci@localhost commit -qm "KNN pary EXE $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" exe
