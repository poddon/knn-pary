name: Build KNN pary APK
on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log
      - name: Save build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/log && tail -300 build.log > /tmp/log/build.log && cd /tmp/log
          git init -q -b build-log && git add build.log
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build log $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" build-log
      - uses: actions/upload-artifact@v4
        with:
          name: KNN-pary-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK (release + apk branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KNN-pary.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --target "$GITHUB_SHA" --title "КНН пары (Android)" --notes "Свежая сборка Android-приложения «КНН пары»" --prerelease
          gh release edit latest --title "КНН пары (Android)" || true
          gh release upload latest KNN-pary.apk --clobber
          mkdir /tmp/apk && cp KNN-pary.apk /tmp/apk/ && cd /tmp/apk
          git init -q -b apk && git add KNN-pary.apk
          git -c user.name=ci -c user.email=ci@localhost commit -qm "KNN pary APK $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" apk
