<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>КНН пары · админ</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: blue header band, one column of working cards (max 920px), sticky publish bar at the bottom */
:root {
  --brand: #1E4FD8; --brand-2: #4F7DF5; --brand-ink: #15307F;
  --bg: #F2F4F9; --card: #FFFFFF; --fg: #171C2B; --muted: #6B7385; --line: #E3E7EF; --soft: #E8EEFD;
  --ok: #0E9F6E; --ok-soft: #E3F6EE; --warn-bg: #FFF3D6; --warn-fg: #7A4B00; --bad: #C92A2A; --bad-soft: #FDECEC;
  --shadow: 0 1px 2px rgba(23,28,43,.06), 0 4px 14px rgba(30,79,216,.06);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --brand: #5B86FF; --brand-2: #2B4FC0; --brand-ink: #0F1F57;
  --bg: #0E1220; --card: #171C2E; --fg: #E8ECF7; --muted: #98A0B8; --line: #283048; --soft: #1E2A4D;
  --ok: #3CCB94; --ok-soft: #12352A; --warn-bg: #3A2C0E; --warn-fg: #FFD98A; --bad: #FF8A8A; --bad-soft: #3A1717;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.4; }
button, input, label.btn { font: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #FFFFFF; border-radius: 0 0 26px 26px; }
header .wrap { padding-block: 20px 18px; }
header h1 { font-family: var(--f-display); font-weight: 600; font-size: 22px; margin: 0; }
header p { margin: 4px 0 0; opacity: .88; font-size: 14px; }
main .wrap { padding-block: 16px 120px; display: grid; gap: 14px; }
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card h2 { margin: 0; font-size: 17px; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; border: 1.5px solid color-mix(in srgb, var(--brand) 35%, transparent); background: var(--card); color: var(--brand); white-space: nowrap; }
.btn.primary { background: var(--brand); color: #FFFFFF; border-color: var(--brand); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
input.f { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 10px; padding: 8px 10px; font-size: 14px; width: 100%; min-width: 0; }
input.f:focus { outline: 2px solid var(--brand); outline-offset: 0; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
code { background: var(--soft); border-radius: 6px; padding: 1px 6px; font-size: 13px; }
.drop { border: 2px dashed color-mix(in srgb, var(--brand) 40%, transparent); border-radius: 16px; padding: 22px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.drop.over { background: var(--soft); }
.msg { border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-line; }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-bg); color: var(--warn-fg); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.day { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.dayhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.dayhead b { font-size: 16px; }
.tag { border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.tag.new { background: var(--soft); color: var(--brand); }
.tag.pub { background: var(--ok-soft); color: var(--ok); }
.tag.chg { background: var(--warn-bg); color: var(--warn-fg); }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .grid3 { grid-template-columns: 1fr 1fr; } }
label.lab { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.col { background: var(--bg); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.lessons { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px; }
td { padding: 3px; vertical-align: top; }
td.n { width: 54px; } td.t { width: 130px; } td.x { width: 36px; }
.tw { color: var(--warn-fg); font-size: 12px; padding: 2px 2px 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -4px 18px rgba(0,0,0,.08); z-index: 5; }
.bar .wrap { padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: 14px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.xbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 6px; }
</style>
</head>
<body>
<header><div class="wrap">
  <h1>КНН пары · админ</h1>
  <p>Загрузи расписание один раз, и оно появится у всех в приложении и на сайте.</p>
</div></header>

<main><div class="wrap">
  <section class="card" id="auth"></section>

  <section class="card">
    <h2>Загрузить PDF с расписанием</h2>
    <div class="drop" id="drop">
      <span class="muted">Перетащи PDF сюда или</span>
      <label class="btn primary" for="pdf">Выбрать PDF</label>
      <input type="file" id="pdf" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div id="pdfMsg" hidden></div>
  </section>

  <section class="card">
    <div class="row"><h2 class="grow">Дни расписания</h2><button class="btn small" type="button" id="addDay">+ День вручную</button></div>
    <p class="muted" id="listNote">Загружаю опубликованное расписание…</p>
    <div id="days" style="display:grid;gap:10px"></div>
  </section>
</div></main>

<div class="bar"><div class="wrap">
  <span class="grow muted" id="barText">Изменений нет</span>
  <button class="btn primary" type="button" id="publish" disabled>Опубликовать для всех</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// Schedule parser: port of ScheduleParser.java. Glyph = {x, w, y (baseline, top-down), h (font size), s}
var Sched = (function () {
  var LABEL = /^\s*(?:(\d{1,2})\s*(?:\)|-?\s*(?:я\s*)?пара|\.(?!\d))\s*)?(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})/i;
  var TIME = /(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})/;
  var TIME_G = /(\d{1,2})[.:](\d{2})\s*[-–—]\s*(\d{1,2})[.:](\d{2})/g;
  var NUM = /^\s*(\d{1,2})\s*(?:\)|-?\s*(?:я\s*)?пара|\.(?!\d))/i;
  var GROUP_TOKEN = /^[0-9][0-9А-ЯЁA-Zа-яё.\-\/]*$/;
  var SPEC = /\d{2}\.\d{2}\.\d{2}/;
  var SPEC_G = /\d{2}\.\d{2}\.\d{2}/g;
  var DATE = /(\d{1,2}\.\d{1,2}\.\d{2,4})/;
  var COURSE = /(\d)\s*курс/i;
  var DAY = /(понедельник|вторник|среда|четверг|пятница|суббота|воскресенье)/i;
  var NAME = /^[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?(?:\s+[А-ЯЁ]\.\s?(?:[А-ЯЁ]\.?)?)?$/;

  function blank(s) { return s.trim() === ""; }

  function collides(line, g) {
    for (var i = 0; i < line.g.length; i++) {
      var o = line.g[i];
      if (blank(o.s)) continue;
      var ov = Math.min(o.x + o.w, g.x + g.w) - Math.max(o.x, g.x);
      if (ov > Math.min(o.w, g.w) * 0.35) return true;
    }
    return false;
  }

  function lines(glyphs) {
    var gs = glyphs.slice().sort(function (a, b) { return a.y - b.y; });
    var out = [];
    gs.forEach(function (g) {
      var target = null;
      for (var i = out.length - 1; i >= 0 && i >= out.length - 4; i--) {
        var l = out[i];
        if (Math.abs(g.y - l.y) > Math.max(2, l.h * 0.3)) continue;
        if (blank(g.s) || !collides(l, g)) { target = l; break; }
      }
      if (target) target.g.push(g); else out.push({ y: g.y, h: g.h, g: [g] });
    });
    out.forEach(function (l) {
      l.g.sort(function (a, b) { return a.x - b.x; });
      var text = "", map = [], prev = null;
      l.g.forEach(function (g, i) {
        if (prev && g.x - (prev.x + prev.w) > Math.max(1.2, g.h * 0.18) && prev.s !== " " && g.s !== " ") { text += " "; map.push(-1); }
        for (var k = 0; k < g.s.length; k++) { text += g.s[k]; map.push(i); }
        prev = g;
      });
      l.text = text; l.map = map;
    });
    return out;
  }

  function segments(l, gap) {
    var out = [], sb = "", x0 = 0, x1 = 0, prev = null;
    l.g.forEach(function (g) {
      if (!prev || g.x - (prev.x + prev.w) > gap) {
        if (prev) out.push([x0, x1, sb.trim()]);
        sb = ""; x0 = g.x;
      } else if (g.x - (prev.x + prev.w) > Math.max(1.2, g.h * 0.18) && prev.s !== " " && g.s !== " ") sb += " ";
      sb += g.s; x1 = g.x + g.w; prev = g;
    });
    if (prev) out.push([x0, x1, sb.trim()]);
    return out.filter(function (o) { return o[2] !== ""; });
  }

  function clean(s) { return s.replace(/\s+/g, " ").trim(); }

  function parsePage(glyphs, known) {
    var sheet = { date: "", weekday: "", course: "", columns: [] };
    var ls = lines(glyphs);
    ls.forEach(function (l) {
      var m;
      if (!sheet.date && l.text.toLowerCase().indexOf("расписание") >= 0 && (m = DATE.exec(l.text))) sheet.date = m[1];
      if (!sheet.weekday && (m = DAY.exec(l.text))) sheet.weekday = m[1].toLowerCase();
      if (!sheet.course && (m = COURSE.exec(l.text))) sheet.course = m[1];
    });

    var labels = [], proto = [], labelRight = 0;
    ls.forEach(function (l) {
      var m = LABEL.exec(l.text);
      if (!m) return;
      var end = m[0].length - 1;
      while (end > 0 && l.map[end] < 0) end--;
      var last = l.g[l.map[end]];
      labelRight = Math.max(labelRight, last.x + last.w);
      labels.push(l.y);
      proto.push({ num: m[1] ? +m[1] : proto.length + 1, time: m[2] + ":" + m[3] + "–" + m[4] + ":" + m[5] });
    });
    if (!labels.length) return sheet;

    var header = null, spec = null, i;
    ls.forEach(function (l) { if (l.y < labels[0] && /^\s*Пара/.test(l.text)) header = l; });
    for (i = 0; i < ls.length; i++) {
      var l = ls[i];
      if (l.y >= labels[0] || (header && l.y <= header.y)) continue;
      if (SPEC.test(l.text) && l.text.toLowerCase().indexOf("расписание") < 0) { spec = l; break; }
    }
    if (!header) {
      for (i = 0; i < ls.length; i++) if (ls[i].y < labels[0] && /\d{3,4}[А-ЯЁA-Z].*\d{3,4}[А-ЯЁA-Z]/.test(ls[i].text)) { header = ls[i]; break; }
    }
    if (!header) return sheet;
    var left = labelRight + 1;

    var centers = [], specs = [];
    if (spec) segments(spec, 8).forEach(function (s) {
      if (SPEC.test(s[2]) && s[1] > left) { centers.push((s[0] + s[1]) / 2); specs.push(s[2]); }
    });
    var hTop = header.y - header.h * 1.4, hBot = spec ? spec.y - spec.h * 0.6 : header.y + header.h * 1.4;
    var headSegs = [];
    ls.forEach(function (l) {
      if (l.y >= hTop && l.y <= hBot && l.h <= header.h * 1.4 && l.text.toLowerCase().indexOf("курс") < 0)
        segments(l, 8).forEach(function (s) { if (s[1] > left && s[2].indexOf("Пара") !== 0) headSegs.push(s); });
    });
    if (!centers.length) {
      headSegs.sort(function (a, b) { return a[0] - b[0]; });
      var cx0 = -1, cx1 = -1;
      headSegs.forEach(function (s) {
        if (cx0 < 0) { cx0 = s[0]; cx1 = s[1]; return; }
        if (s[0] - cx1 > 24) { centers.push((cx0 + cx1) / 2); specs.push(""); cx0 = s[0]; }
        cx1 = Math.max(cx1, s[1]);
      });
      if (cx0 >= 0) { centers.push((cx0 + cx1) / 2); specs.push(""); }
    }
    var nc = centers.length, lo = [], hi = [];
    for (i = 0; i < nc; i++) {
      lo[i] = i === 0 ? left : (centers[i - 1] + centers[i]) / 2;
      hi[i] = i === nc - 1 ? Infinity : (centers[i] + centers[i + 1]) / 2;
      var col = { groups: [], spec: specs[i], lessons: [] }, sb = "";
      headSegs.forEach(function (s) { var cx = (s[0] + s[1]) / 2; if (cx >= lo[i] && cx < hi[i]) sb += s[2] + ","; });
      col.groups = groupTokens(sb);
      sheet.columns.push(col);
    }

    var nr = labels.length, top = [], bot = [];
    var firstTop = (spec ? spec.y : header.y) + 2;
    for (var r = 0; r < nr; r++) {
      top[r] = r === 0 ? firstTop : bot[r - 1];
      bot[r] = r === nr - 1 ? labels[r] + Math.max(20, labels[r] - top[r]) : (labels[r] + labels[r + 1]) / 2;
    }

    for (var ci = 0; ci < nc; ci++) {
      for (r = 0; r < nr; r++) {
        var cell = glyphs.filter(function (g) { var cx = g.x + g.w / 2; return cx >= lo[ci] && cx < hi[ci] && g.y > top[r] && g.y <= bot[r] && !blank(g.s); });
        if (!cell.length) continue;
        var texts = lines(cell).map(function (l) { return clean(l.text); });
        var sp = split(texts, known), subject = sp.subject, teachers = sp.teachers;
        if (!subject && !teachers.length) continue;
        sheet.columns[ci].lessons.push({ num: proto[r].num, time: proto[r].time, subject: subject, teachers: teachers });
      }
    }
    return sheet;
  }


  function split(texts, known) {
    var teachers = [], cut = texts.length;
    for (var t = texts.length - 1; t >= 0; t--) {
      var items = texts[t].split(/[,;]/), nameLine = true, isKnown = true, names = [];
      for (var k = 0; k < items.length; k++) {
        var it = items[k].trim(); if (!it) continue;
        if (!NAME.test(it)) { nameLine = false; break; }
        names.push(it);
        if (!known[it.split(/\s+/)[0]]) isKnown = false;
      }
      if (!nameLine || !names.length) break;
      if (t !== texts.length - 1 && !isKnown) break;
      if (t === texts.length - 1 && texts.length === 1 && !isKnown) break;
      for (k = names.length - 1; k >= 0; k--) if (teachers.indexOf(names[k]) < 0) teachers.unshift(names[k]);
      cut = t;
    }
    var subj = [];
    texts.slice(0, cut).forEach(function (x) { if (subj.indexOf(x) < 0) subj.push(x); });
    return { subject: clean(subj.join(" ")).replace(/[,;]$/, ""), teachers: teachers };
  }

  function groupTokens(text) {
    var out = [];
    text.split(/[,;\s]+/).forEach(function (t) {
      t = t.trim();
      if (t.length < 3 || /^\d{2}\.\d{2}\.\d{2}$/.test(t) || /^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(t) || TIME.test(t)) return;
      if (GROUP_TOKEN.test(t) && (/\d{3,}/.test(t) || /\d.*[А-ЯЁA-Zа-яё]/.test(t))) out.push(t);
    });
    return out;
  }

  function titleInfo(sheet, ls) {
    ls.forEach(function (l) {
      var m;
      if (!sheet.date && l.text.toLowerCase().indexOf("расписание") >= 0 && (m = DATE.exec(l.text))) sheet.date = m[1];
      if (!sheet.weekday && (m = DAY.exec(l.text))) sheet.weekday = m[1].toLowerCase();
      if (!sheet.course && (m = COURSE.exec(l.text))) sheet.course = m[1];
    });
    if (!sheet.date) for (var i = 0; i < ls.length; i++) { var m2 = DATE.exec(ls[i].text); if (m2 && !SPEC.test(ls[i].text)) { sheet.date = m2[1]; break; } }
  }

  // ===================== grid-based parsing =====================
  function addRect(out, x0, y0, x1, y1, stroked) {
    var l = Math.min(x0, x1), r = Math.max(x0, x1), t = Math.min(y0, y1), b = Math.max(y0, y1), w = r - l, h = b - t;
    if (h <= 3 && w > 3) out.push({ h: true, pos: (t + b) / 2, a: l, b: r });
    else if (w <= 3 && h > 3) out.push({ h: false, pos: (l + r) / 2, a: t, b: b });
    else if (stroked && w > 3 && h > 3) {
      out.push({ h: true, pos: t, a: l, b: r }, { h: true, pos: b, a: l, b: r }, { h: false, pos: l, a: t, b: b }, { h: false, pos: r, a: t, b: b });
    }
  }
  function addLine(out, x0, y0, x1, y1) {
    if (Math.abs(y1 - y0) < 1.5 && Math.abs(x1 - x0) > 3) out.push({ h: true, pos: (y0 + y1) / 2, a: Math.min(x0, x1), b: Math.max(x0, x1) });
    else if (Math.abs(x1 - x0) < 1.5 && Math.abs(y1 - y0) > 3) out.push({ h: false, pos: (x0 + x1) / 2, a: Math.min(y0, y1), b: Math.max(y0, y1) });
  }
  function cluster(v, tol) {
    v = v.slice().sort(function (a, b) { return a - b; });
    var out = [], sum = 0, n = 0, last = NaN;
    v.forEach(function (x) { if (n && x - last > tol) { out.push(sum / n); sum = 0; n = 0; } sum += x; n++; last = x; });
    if (n) out.push(sum / n);
    return out;
  }
  function coverage(segs, horiz, pos, a, b, tol) {
    var iv = [];
    segs.forEach(function (s) { if (s.h === horiz && Math.abs(s.pos - pos) <= tol) { var lo = Math.max(a, s.a), hi = Math.min(b, s.b); if (hi > lo) iv.push([lo, hi]); } });
    iv.sort(function (p, q) { return p[0] - q[0]; });
    var cov = 0, cl = -1, ch = -1;
    iv.forEach(function (i) { if (ch < 0 || i[0] > ch) { if (ch > 0) cov += ch - cl; cl = i[0]; ch = i[1]; } else ch = Math.max(ch, i[1]); });
    if (ch > 0) cov += ch - cl;
    return b > a ? cov / (b - a) : 0;
  }
  function cells(segs, glyphs) {
    var xs = cluster(segs.filter(function (s) { return !s.h; }).map(function (s) { return s.pos; }), 2.5);
    var ys = cluster(segs.filter(function (s) { return s.h; }).map(function (s) { return s.pos; }), 2.5);
    var nx = xs.length - 1, ny = ys.length - 1;
    if (nx < 2 || ny < 2 || nx * ny > 20000) return null;
    var parent = []; for (var i = 0; i < nx * ny; i++) parent[i] = i;
    function find(i) { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; }
    for (var j = 0; j < ny; j++) for (i = 0; i < nx; i++) {
      if (i + 1 < nx && coverage(segs, false, xs[i + 1], ys[j], ys[j + 1], 2.5) < 0.5) parent[find(j * nx + i)] = find(j * nx + i + 1);
      if (j + 1 < ny && coverage(segs, true, ys[j + 1], xs[i], xs[i + 1], 2.5) < 0.5) parent[find(j * nx + i)] = find((j + 1) * nx + i);
    }
    var map = {}, out = [];
    for (j = 0; j < ny; j++) for (i = 0; i < nx; i++) {

function diagnose(text, chars, pages) {
  if (chars < 20) return "В этом PDF нет текста: похоже, это картинка или скан. Его нельзя прочитать автоматически. Добавь пары вручную («+ День вручную») или попроси PDF, сохранённый из Excel.";
  var times = (text.match(Sched.TIME_G) || []).length;
  var groups = Sched.groupTokens(text.replace(/\n/g, " ")).filter(function (g, i, a) { return a.indexOf(g) === i; }).slice(0, 10);
  var b = "Не получилось найти таблицу пар.\nСтраниц: " + pages + ". Время пар (вида 08.00-09.30): " + (times ? "найдено " + times : "не найдено") + ".";
  if (groups.length) b += "\nПохоже на номера групп: " + groups.join(", ");
  b += "\nМожно ввести пары вручную: «+ День вручную». Пришли этот PDF разработчику, чтобы разбор научился его читать.";
  return b;
}

        addSheet(sh); added++;
        var pairs = 0; sh.columns.forEach(function (c) { pairs += c.lessons.length; });
        lines.push(r.file + ": " + (sh.date || "дата не найдена") + (sh.course ? ", " + sh.course + " курс" : "") + " — групп: " + sh.columns.length + ", пар: " + pairs + ".");
      });
    });
    if (added) lines.push("Проверь пары ниже и нажми «Опубликовать для всех».");
    m.className = "msg " + (bad ? (added ? "warn" : "bad") : "ok"); m.textContent = lines.join("\n");
    render();
  });
}

function addSheet(sh) {
  sh.weekday = sh.weekday || (parseDate(sh.date) ? WD[parseDate(sh.date).getDay()] : "");
  var i = days.findIndex(function (d) { return sh.date && d.sheet.date === sh.date && (d.sheet.course || "") === (sh.course || ""); });
  var item = { sheet: sh, state: "new", open: true };
  if (i >= 0) { item.state = days[i].state === "pub" ? "chg" : days[i].state; days[i] = item; } else days.unshift(item);
  saveDraft();
}

/* ---------- list & editor ---------- */
function pairsOf(sh) { var n = 0; sh.columns.forEach(function (c) { n += c.lessons.length; }); return n; }
function sortDays() { days.sort(function (a, b) { return dayKey(b.sheet.date) - dayKey(a.sheet.date); }); }
function saveDraft() { ls("draft", JSON.stringify(days)); renderBar(); }
function changes() { return days.filter(function (d) { return d.state !== "pub"; }).length + removed; }

function renderBar() {
  var n = changes();
  $("barText").textContent = n ? "Неопубликованных изменений: " + n : "Изменений нет";
  $("publish").disabled = !n || !(token && login);
  $("publish").title = token && login ? "" : "Сначала подключи доступ к GitHub";
}

function render() {
  var box = $("days");
  if (!days.length) { box.innerHTML = '<p class="muted">Дней нет. Загрузи PDF или добавь день вручную.</p>'; renderBar(); return; }
  box.innerHTML = days.map(function (d, i) {
    var sh = d.sheet, dt = parseDate(sh.date);
    var title = (dt ? WD[dt.getDay()][0].toUpperCase() + WD[dt.getDay()].slice(1) + ", " + sh.date : "Дата не указана") + (sh.course ? " · " + esc(sh.course) + " курс" : "");
    var tag = d.state === "pub" ? '<span class="tag pub">Опубликовано</span>' : d.state === "new" ? '<span class="tag new">Новое</span>' : '<span class="tag chg">Изменено</span>';
    var past = dt && dayKey(sh.date) < dayKey(fmtDate(new Date())) ? ' <span class="muted">(прошло)</span>' : "";
    var h = '<div class="day"><div class="dayhead"><b>' + title + "</b>" + past + tag + '<span class="muted grow">групп: ' + sh.columns.length + ", пар: " + pairsOf(sh) + "</span>" +
      '<button class="btn small" type="button" data-act="toggle" data-i="' + i + '">' + (d.open ? "Свернуть" : "Изменить") + "</button>" +
      '<button class="btn small danger" type="button" data-act="delday" data-i="' + i + '">Удалить</button></div>';
    if (d.open) h += editor(sh, i);
    return h + "</div>";
  }).join("");
  renderBar();
}

function editor(sh, i) {
  var h = '<div class="grid3"><label class="lab">Дата (дд.мм.гггг)<input class="f" data-i="' + i + '" data-k="date" value="' + esc(sh.date) + '" placeholder="30.10.2026"></label>' +
    '<label class="lab">Курс<input class="f" data-i="' + i + '" data-k="course" value="' + esc(sh.course) + '" placeholder="2"></label>' +
    '<label class="lab">День недели<input class="f" value="' + esc(sh.weekday) + '" disabled></label></div>';
  sh.columns.forEach(function (c, ci) {
    h += '<div class="col"><div class="row"><label class="lab grow">Группы через запятую<input class="f" data-i="' + i + '" data-c="' + ci + '" data-k="groups" value="' + esc(c.groups.join(", ")) + '" placeholder="1515А, 1516А"></label>' +
      '<label class="lab" style="width:140px">Специальность<input class="f" data-i="' + i + '" data-c="' + ci + '" data-k="spec" value="' + esc(c.spec) + '" placeholder="38.02.08"></label>' +
      '<button class="btn small danger" type="button" data-act="delcol" data-i="' + i + '" data-c="' + ci + '" style="align-self:end">Удалить группу</button></div>' +
      '<div class="lessons"><table><thead><tr><th>№</th><th>Время</th><th>Предмет</th><th>Преподаватели (фамилии через запятую)</th><th></th></tr></thead><tbody>';
    c.lessons.forEach(function (l, li) {
      var a = 'data-i="' + i + '" data-c="' + ci + '" data-l="' + li + '"';
      h += '<tr><td class="n"><input class="f" ' + a + ' data-k="num" value="' + esc(l.num) + '"></td>' +
        '<td class="t"><input class="f" ' + a + ' data-k="time" value="' + esc(l.time) + '" placeholder="08:00–09:30"></td>' +
        '<td><input class="f" ' + a + ' data-k="subject" value="' + esc(l.subject) + '"></td>' +
        '<td><input class="f" ' + a + ' data-k="teachers" value="' + esc(l.teachers.join(", ")) + '"><div class="tw" id="tw-' + i + "-" + ci + "-" + li + '">' + teacherWarn(l.teachers) + "</div></td>" +
        '<td class="x"><button class="xbtn" type="button" title="Удалить пару" data-act="dellesson" ' + a + ">✕</button></td></tr>";
    });
    h += '</tbody></table></div><div><button class="btn small" type="button" data-act="addlesson" data-i="' + i + '" data-c="' + ci + '">+ пара</button></div></div>';
  });
  return h + '<div><button class="btn small" type="button" data-act="addcol" data-i="' + i + '">+ группа</button></div>';
}

function teacherWarn(list) {
  var bad = list.filter(function (t) { return t.trim() && !knownSurname(t); });
  return bad.length ? "Нет в списке преподавателей, кнопки входа не будет: " + esc(bad.join(", ")) : "";
}

function touch(i) { if (days[i].state === "pub") days[i].state = "chg"; saveDraft(); }

$("days").addEventListener("input", function (e) {
  var el = e.target, k = el.getAttribute("data-k"); if (!k) return;
  var i = +el.getAttribute("data-i"), sh = days[i].sheet, v = el.value;
  if (el.hasAttribute("data-l")) {
    var l = sh.columns[+el.getAttribute("data-c")].lessons[+el.getAttribute("data-l")];
    if (k === "num") l.num = parseInt(v, 10) || 0;
    else if (k === "teachers") { l.teachers = v.split(/[,;]/).map(function (s) { return s.trim(); }).filter(Boolean); var w = $("tw-" + i + "-" + el.getAttribute("data-c") + "-" + el.getAttribute("data-l")); if (w) w.innerHTML = teacherWarn(l.teachers); }
    else l[k] = v;
  } else if (el.hasAttribute("data-c")) {
    var c = sh.columns[+el.getAttribute("data-c")];
    if (k === "groups") c.groups = v.split(/[,;]/).map(function (s) { return s.replace(/\s+/g, ""); }).filter(Boolean); else c[k] = v.trim();
  } else {
    sh[k] = v.trim();
    if (k === "date") { var dt = parseDate(sh.date); sh.weekday = dt ? WD[dt.getDay()] : ""; }
  }
  touch(i);
});
$("days").addEventListener("change", function (e) {
  var el = e.target;
  if (el.getAttribute("data-k") === "time") { el.value = normTime(el.value); el.dispatchEvent(new Event("input", { bubbles: true })); }
  if (el.getAttribute("data-k") === "date") render();
});
$("days").addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), i = +b.getAttribute("data-i"), ci = +b.getAttribute("data-c"), li = +b.getAttribute("data-l");
  if (act === "toggle") { days[i].open = !days[i].open; render(); return; }
  if (act === "delday") {
    if (b.getAttribute("data-sure") !== "1") { b.setAttribute("data-sure", "1"); b.textContent = "Точно удалить?"; setTimeout(function () { if (b.isConnected) { b.removeAttribute("data-sure"); b.textContent = "Удалить"; } }, 4000); return; }
    if (days[i].state !== "new") removed++;
    days.splice(i, 1); saveDraft(); render(); return;
  }
  var sh = days[i].sheet;
  if (act === "addcol") sh.columns.push({ groups: [], spec: "", lessons: [{ num: 1, time: "", subject: "", teachers: [] }] });
  if (act === "delcol") sh.columns.splice(ci, 1);
  if (act === "addlesson") { var ls2 = sh.columns[ci].lessons, last = ls2[ls2.length - 1]; ls2.push({ num: last ? (+last.num || 0) + 1 : 1, time: "", subject: "", teachers: [] }); }
  if (act === "dellesson") sh.columns[ci].lessons.splice(li, 1);
  touch(i); render();
});
$("addDay").onclick = function () {
  var dt = new Date(); dt.setDate(dt.getDate() + 1);
  days.unshift({ sheet: { date: fmtDate(dt), weekday: WD[dt.getDay()], course: "", columns: [{ groups: [], spec: "", lessons: [{ num: 1, time: "", subject: "", teachers: [] }] }] }, state: "new", open: true });
  saveDraft(); render();
};

/* ---------- publish ---------- */
function clean(sh) {
  return {
    date: sh.date, weekday: sh.weekday || "", course: sh.course || "",
    columns: sh.columns.filter(function (c) { return c.groups.length; }).map(function (c) {
      return { groups: c.groups, spec: c.spec || "", lessons: c.lessons.filter(function (l) { return l.subject || l.teachers.length; }).map(function (l) {
        return { num: +l.num || 0, time: normTime(l.time), subject: (l.subject || "").trim(), teachers: l.teachers };
      }).sort(function (a, b) { return a.num - b.num; }) };
    })
  };
}

$("publish").onclick = function () {
  var problems = [];
  days.forEach(function (d) {
    if (!parseDate(d.sheet.date)) problems.push("у одного из дней не указана дата");
    d.sheet.columns.forEach(function (c) { c.lessons.forEach(function (l) { if ((l.subject || l.teachers.length) && !/^\d{2}:\d{2}–\d{2}:\d{2}$/.test(normTime(l.time))) problems.push(d.sheet.date + ", " + (c.groups.join(",") || "без группы") + ": у пары " + l.num + " нет времени"); }); });
  });
  if (problems.length) { toast("Исправь: " + problems[0]); return; }
  var limit = dayKey(fmtDate(new Date(Date.now() - 21 * 86400000)));
  var sheets = days.map(function (d) { return clean(d.sheet); }).filter(function (s) { return dayKey(s.date) >= limit; }).sort(function (a, b) { return dayKey(b.date) - dayKey(a.date); });
  var body = JSON.stringify({ updated: new Date().toISOString(), sheets: sheets }, null, 1);
  var names = days.filter(function (d) { return d.state !== "pub"; }).map(function (d) { return d.sheet.date; }).join(", ");
  var btn = $("publish"); btn.disabled = true; btn.textContent = "Публикую…";
  gh("/repos/" + REPO + "/contents/" + FILE + "?ref=" + BRANCH).then(function (r) { sha = r.sha; }).then(function () {
    return gh("/repos/" + REPO + "/contents/" + FILE, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: "Расписание" + (names ? ": " + names : ""), content: b64encode(body), branch: BRANCH, sha: sha }) });
  }).then(function (r) {
    sha = r.content.sha;
    days = sheets.map(function (s) { return { sheet: s, state: "pub", open: false }; }); removed = 0;
    ls("draft", null);
    $("listNote").textContent = "Опубликовано: " + new Date().toLocaleString("ru-RU") + ". Приложения забирают обновления в течение 15–30 минут.";
    render(); toast("Опубликовано для всех");
  }).catch(function (e) {
    toast("Не удалось опубликовать: " + e.message + (e.status === 401 || e.status === 403 ? ". Проверь ключ доступа." : ""));
  }).then(function () { btn.textContent = "Опубликовать для всех"; renderBar(); });
};

/* ---------- start ---------- */
$("pdf").onchange = function () { handleFiles(this.files); this.value = ""; };
var drop = $("drop");
["dragenter", "dragover"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
["dragleave", "drop"].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
drop.addEventListener("drop", function (e) { handleFiles(e.dataTransfer.files); });
window.addEventListener("beforeunload", function (e) { if (changes()) { e.preventDefault(); e.returnValue = ""; } });

renderAuth(); renderBar();
if (token) connect(false); else loadPublished();
</script>
</body>
</html>
